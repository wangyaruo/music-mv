name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Compile
        run: python -m py_compile scripts/*.py examples/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end demo
        run: python examples/make_demo.py --out out/demo
      - name: Verify deliverables
        run: |
          test -s "out/demo/成片.mp4"
          test -s "out/demo/out/cover.png"
          test -s "out/demo/out/qa/film_sheet.png"
          test -s "out/demo/out/qa_report.json"
